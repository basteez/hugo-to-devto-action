name: Hugo to dev.to Crosspost
description: Mirror new Hugo posts to dev.to as drafts. Parses Hugo frontmatter, dedupes by title, supports dry-run.
author: Tiziano Basile
branding:
  icon: upload-cloud
  color: purple

inputs:
  devto-api-key:
    description: >-
      dev.to Personal API Key. Provide via a repository secret (e.g.
      secrets.DEVTO_API_KEY). The action fails with a non-zero exit
      status when this input is empty or missing.
    required: true

  before:
    description: >-
      "Before" SHA of the push range. Typically github.event.before.
      Must be reachable in the checked-out repository (use
      actions/checkout@v4 with fetch-depth: 0).
    required: true

  after:
    description: >-
      "After" SHA of the push range. Typically github.event.after.
    required: true

  post-dir:
    description: >-
      Directory (relative to the consumer repo root) that contains Hugo posts.
      Only files touched inside this directory between `before` and `after`
      are considered.
    required: false
    default: content/post

  dry-run:
    description: >-
      When set to the literal string `'true'`, the action simulates crossposting
      (no POST /articles call to dev.to) and logs what would happen. Any other
      value leaves dry-run off.
    required: false
    default: "false"

  site-url:
    description: >-
      Optional. Public base URL of your Hugo site, for example
      https://example.com. When set, relative image links in the post become
      absolute, and the draft gets canonical_url (the post URL) and main_image
      (front matter `image`). Empty (the default) keeps the previous behaviour.
    required: false
    default: ""

  permalink-pattern:
    description: >-
      Required when site-url is set. Path of a post on your site, as in your
      Hugo permalinks config, for example /posts/:slug/. Supported tokens:
      :slug, :title, :filename, :year, :month, :day. A front matter `url`
      wins over the pattern.
    required: false
    default: ""

  mermaid:
    description: >-
      What to do with ```mermaid code blocks, which dev.to does not render.
      `keep` (the default) leaves them as code. `image` replaces each one with
      an image rendered by mermaid-service-url; the diagram source is sent to
      that service inside the image URL.
    required: false
    default: keep

  mermaid-service-url:
    description: >-
      Renderer used when mermaid is `image`. Must serve
      /img/pako:<data>?type=png like mermaid.ink (a self-hosted mermaid.ink
      works too).
    required: false
    default: https://mermaid.ink

runs:
  using: composite
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install crosspost dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install --require-hashes -r "${{ github.action_path }}/crosspost/requirements.lock"

    - name: Run crosspost
      shell: bash
      env:
        DEVTO_API_KEY: ${{ inputs.devto-api-key }}
        CROSSPOST_SITE_URL: ${{ inputs.site-url }}
        CROSSPOST_PERMALINK_PATTERN: ${{ inputs.permalink-pattern }}
        CROSSPOST_MERMAID: ${{ inputs.mermaid }}
        CROSSPOST_MERMAID_SERVICE_URL: ${{ inputs.mermaid-service-url }}
        PYTHONPATH: ${{ github.action_path }}
      run: |
        python -m crosspost \
          --before "${{ inputs.before }}" \
          --after "${{ inputs.after }}" \
          --post-dir "${{ inputs.post-dir }}" \
          ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
